<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090a0f">
<title>BLACKSITE — Universal AI Website Builder</title>
<style>
:root{
  --bg:#08090e;--panel:#11131b;--panel2:#171a24;--line:#282c39;
  --text:#f4f5fa;--muted:#9298aa;--accent:#8b7cff;--accent2:#39d6c2;
  --danger:#ff657a;--success:#2ecc71;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,-apple-system,sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app{max-width:1200px;margin:auto;min-height:100vh;padding:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 4px 18px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:850;letter-spacing:1.6px}
.mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#9c8cff,#42d7c3);display:grid;place-items:center;color:#08090e;font-weight:950;font-size:16px}
.pill{font-size:10px;color:#b9b2ff;border:1px solid #4a426e;border-radius:30px;padding:3px 8px}
.top-actions{display:flex;align-items:center;gap:10px}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:8px 14px;border-radius:10px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#090912}
.btn.danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn.ghost{background:transparent}
.btn.small{padding:6px 10px;font-size:12px}
.btn:active{transform:scale(.97)}

/* User Profile Badge */
.user-avatar-badge{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);padding:4px 12px;border-radius:30px;cursor:pointer}
.user-avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#8b7cff,#39d6c2);display:grid;place-items:center;color:#08090e;font-weight:800;font-size:11px}

/* Layout */
.layout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:18px;padding-top:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
h1{font-size:24px;line-height:1.2;margin:4px 0 8px}
h2{font-size:15px;margin:0 0 12px}
.muted{color:var(--muted)}
.eyebrow{font-size:10px;letter-spacing:1.5px;color:var(--accent2);font-weight:800;text-transform:uppercase}
label{display:block;font-size:12px;color:#c7cada;margin:12px 0 6px}
input,textarea,select{width:100%;background:#0b0d14;border:1px solid var(--line);border-radius:10px;color:var(--text);padding:10px;outline:none}
textarea{min-height:85px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.hint{font-size:11px;color:var(--muted);margin-top:7px}

/* Templates & Sections */
.templates{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.template{background:#0c0e15;border:1px solid var(--line);border-radius:10px;padding:9px;text-align:left;color:var(--text)}
.template b{display:block;font-size:12px}
.template span{display:block;color:var(--muted);font-size:10px;margin-top:2px}
.template.active{border-color:var(--accent);background:#17152a}
.section-list{display:flex;flex-direction:column;gap:7px;margin-top:10px}
.section-item{display:flex;align-items:center;gap:8px;background:#0b0d14;border:1px solid var(--line);border-radius:10px;padding:8px}
.section-item.active{border-color:var(--accent)}
.section-name{flex:1;min-width:0;font-size:12px;font-weight:600;cursor:pointer}
.section-item button{padding:4px 8px;border-radius:6px;border:1px solid var(--line);background:#171a24;color:var(--text)}

/* Canvas */
.preview-wrap{min-width:0}
.preview-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.tabs{display:flex;gap:4px;background:#0a0c12;padding:4px;border:1px solid var(--line);border-radius:10px}
.tab{border:0;background:transparent;color:var(--muted);padding:6px 12px;border-radius:7px;font-size:12px}
.tab.active{background:#242139;color:#fff}
.canvas{background:#f6f5f2;color:#171923;border-radius:14px;overflow:hidden;min-height:600px;box-shadow:0 18px 50px rgba(0,0,0,0.6)}
.site{max-width:100%;margin:auto}
.site-section{position:relative;padding:50px 7%}
.site-section.selected{outline:2px solid #8b7cff;outline-offset:-2px}
.site-section:hover .select-tag{opacity:1}
.select-tag{position:absolute;top:8px;right:10px;background:#8b7cff;color:#08090e;padding:4px 7px;border-radius:6px;font-size:10px;opacity:0;cursor:pointer}

/* Inner Site Output */
.hero{background:linear-gradient(135deg,#14172a,#262044);color:white;text-align:center;padding:70px 7%}
.hero h1{font-size:clamp(26px,5vw,50px);max-width:750px;margin:0 auto 12px;color:#fff}
.hero p{color:#d0cee0;max-width:560px;margin:0 auto 20px;font-size:15px}
.site-cta{display:inline-block;background:#a99cff;color:#121020;text-decoration:none;border-radius:30px;padding:11px 22px;font-weight:700}
.site-nav{display:flex;align-items:center;justify-content:space-between;padding:16px 7%;background:#fff;border-bottom:1px solid #eee;color:#171923}
.features{background:#fff;color:#171923}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.feature{border:1px solid #e7e7ed;border-radius:12px;padding:16px}.feature h3{font-size:15px;margin:8px 0 4px}
.about{background:#f0eff7;text-align:center;color:#171923}.contact{background:#fff;text-align:center;color:#171923}
.footer{background:#11131b;color:#c5c7d2;text-align:center;padding:22px;font-size:12px}
.editor{margin-top:16px}.editor-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* Modals */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);display:none;place-items:center;z-index:100;backdrop-filter:blur(4px);padding:14px}
.modal-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;max-width:400px;width:100%;padding:22px;box-shadow:0 15px 40px rgba(0,0,0,0.8)}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#e9e5ff;color:#171329;padding:10px 18px;border-radius:10px;font-weight:700;box-shadow:0 8px 30px rgba(0,0,0,0.6);display:none;z-index:200}

@media(max-width:850px){.layout{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.top-actions .desktop{display:none}}
</style>
</head>

      <div class="canvas" id="canvas">
        <div class="site" id="site"></div>

      <section class="panel editor">
        <div class="eyebrow">Visual Customizer</div>
        <h2 id="editorTitle">Section Editor</h2>
        <div id="editorFields"></div>

</div>

<!-- Modal: Auth -->
<div class="modal-overlay" id="authModal">
  <div class="modal-card">
    <div class="modal-head">
      <h3 style="margin:0" id="authModalTitle">Login to BLACKSITE</h3>

      <label for="authPass">Password</label>

      </div>
      
      <button type="submit" class="btn primary" style="width:100%;margin-top:16px" id="authSubmitBtn">Continue</button>
    </form>
    
    <p class="hint" style="text-align:center;margin-top:12px">
      <span id="authToggleText">Don't have an account?</span> 
      <a href="#" style="color:var(--accent)" id="authToggleLink">Sign Up</a>
    </p>
  </div>
</div>

<!-- Modal: Profile -->
<div class="modal-overlay" id="profileModal">

    <div class="modal-head">
      <h3 style="margin:0">Creator Profile</h3>

    <div style="background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0">

    <button class="btn danger" style="width:100%;margin-top:14px" id="logoutBtn">Log Out</button>

</div>

<div class="toast" id="toast"></div>

function clone(x){return JSON.parse(JSON.stringify(x))}
function toast(m){let t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(window._t);window._t=setTimeout(()=>t.style.display='none',2400)}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

/* Auth System */
function toggleModal(id,show){$('#'+id).style.display=show?'grid':'none'}

function updateAuthUI(){
  const box=$('#authContainer');
  if(currentUser){
    const initial=currentUser.name.charAt(0).toUpperCase();
    box.innerHTML=`<div class="user-avatar-badge" id="openProfileBadge">
      <div class="user-avatar">${initial}</div>
      <span style="font-weight:600;font-size:12px">${esc(currentUser.name)}</span>
    </div>`;
    $('#openProfileBadge').onclick=()=>toggleModal('profileModal',true);
    $('#profileNameDisplay').textContent=currentUser.name;
    $('#profileEmailDisplay').textContent=currentUser.email;
    $('#profileBigAvatar').textContent=initial;
  }else{
    box.innerHTML=`<button class="btn primary small" id="openLoginBtn">Login / Signup</button>`;
    $('#openLoginBtn').onclick=()=>toggleModal('authModal',true);
  }
}

$('#closeAuthBtn').onclick=()=>toggleModal('authModal',false);
$('#closeProfileBtn').onclick=()=>toggleModal('profileModal',false);
